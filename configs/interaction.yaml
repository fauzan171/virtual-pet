camera:
  width: 1280
  height: 720
  fps_target: 30

smoothing:
  pose_alpha: 0.45
  hand_alpha: 0.35
  face_alpha: 0.40

tracking:
  segmentation_enabled: true
  segmentation_threshold: 0.55
  segmentation_min_area_ratio: 0.015
  visibility_threshold: 0.45
  anchor_hold_ms: 220

motion:
  anchor_hold_ms: 250
  min_anchor_confidence: 0.25
  reference_body_scale_px: 230
  min_body_scale: 0.55
  max_body_scale: 1.80
  max_frame_gap_ms: 100
  safe_margin_px: 88

gestures:
  wave_min_frames: 8
  open_palm_hold_ms: 700
  point_hold_ms: 500
  lean_in_ratio: 1.15
  smile_threshold: 0.65
  two_hand_pose_hold_ms: 900

cooldowns:
  greeting_ms: 2500
  follow_ms: 600
  voice_line_ms: 6000
  evolve_ms: 6000
  idle_chatter_ms: 12000

voice:
  capture_timeout_s: 0.35
  min_transcript_confidence: 0.45
  failure_backoff_s: 0.25
  post_speech_guard_ms: 350

render:
  pet_idle_anchor: right_shoulder
  subtitle_y_offset: 60
  glow_strength: 0.8
  particle_density: 0.4
  skin: fox  # fox | cat | bunny, override with --skin

ai:
  provider: auto
  persona: playful hologram robot fox
